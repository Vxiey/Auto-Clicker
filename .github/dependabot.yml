version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - rust
    groups:
      rust-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - rust
    groups:
      tauri-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - frontend
    groups:
      npm-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - github-actions
    groups:
      actions-non-major:
        update-types:
          - minor
          - patch
