name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Format core
        run: cargo fmt --all -- --check
      - name: Format Tauri
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check core
        run: cargo check --all-targets
      - name: Test core
        # Native hotkey tests intentionally share the single process-global Windows hook registry.
        # Serialize them so independent tests cannot replace that registry while another test is asserting it.
        run: cargo test --all-targets -- --test-threads=1
      - name: Clippy core
        run: cargo clippy --all-targets -- -D warnings
      - name: Check Tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml
