name: Windows Release Build

on:
  push:
    branches:
      - main
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Validate release metadata
        id: release_meta
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "src-tauri/tauri.conf.json does not contain a version"
          }

          $rootCargo = Get-Content "Cargo.toml" -Raw
          if (-not $rootCargo.Contains("version = `"$version`"")) {
            throw "Cargo.toml is not synchronized to version $version"
          }

          $tauriCargo = Get-Content "src-tauri/Cargo.toml" -Raw
          if (-not $tauriCargo.Contains("version = `"$version`"")) {
            throw "src-tauri/Cargo.toml is not synchronized to version $version"
          }

          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ([string]$package.version -ne $version) {
            throw "package.json is not synchronized to version $version"
          }

          $uiVersion = Get-Content "ui/src/version.ts" -Raw
          if (-not $uiVersion.Contains("APP_VERSION = `"$version`"")) {
            throw "ui/src/version.ts is not synchronized to version $version"
          }

          $changelog = Get-Content "CHANGELOG.md" -Raw
          if (-not $changelog.Contains("## [$version]")) {
            throw "CHANGELOG.md is missing version $version"
          }

          $uiChangelog = Get-Content "ui/src/changelog.ts" -Raw
          $uiMarker = 'version: "' + $version + '"'
          if (-not $uiChangelog.Contains($uiMarker)) {
            throw "ui/src/changelog.ts is missing version $version"
          }

          $notesPath = "docs/releases/v$version.md"
          if (-not (Test-Path $notesPath)) {
            throw "Missing release notes: $notesPath"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          Write-Host "Release metadata verified for VxClick $version"

      - name: Build VxClick Windows bundles
        run: npm run tauri:build

      - name: Verify Windows shell metadata
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/release/vxclick.exe"
          $exe = [System.IO.File]::ReadAllBytes($exePath)
          $peOffset = [BitConverter]::ToInt32($exe, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($exe, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "vxclick.exe must use IMAGE_SUBSYSTEM_WINDOWS_GUI (2), got $subsystem"
          }

          $icoPath = "src-tauri/icons/icon.ico"
          $ico = [System.IO.File]::ReadAllBytes($icoPath)
          $iconCount = [BitConverter]::ToUInt16($ico, 4)
          if ($iconCount -lt 6) {
            throw "icon.ico must contain a multi-resolution icon set; found only $iconCount image(s)"
          }

          Write-Host "Verified GUI subsystem and $iconCount Windows icon layers."

      - name: Collect portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src-tauri/target/release/vxclick.exe" "artifacts/VxClick.exe"
          if (Test-Path "src-tauri/target/release/bundle") {
            Copy-Item "src-tauri/target/release/bundle" "artifacts/bundle" -Recurse
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: VxClick-Windows-x64
          path: artifacts/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Publish VxClick GitHub Release
        if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: VxClick ') }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VX_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_NOTES: ${{ steps.release_meta.outputs.notes_path }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $expectedPrefix = "release: VxClick $env:VX_VERSION"
          if (-not $env:RELEASE_MESSAGE.StartsWith($expectedPrefix)) {
            throw "Release commit message must start with '$expectedPrefix'"
          }

          $tag = "v$env:VX_VERSION"
          $releaseSha = $env:GITHUB_SHA

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag $releaseSha
          git push origin "refs/tags/$tag" --force

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --target $releaseSha --title "VxClick $env:VX_VERSION" --notes-file $env:RELEASE_NOTES
          } else {
            gh release create $tag --target $releaseSha --title "VxClick $env:VX_VERSION" --notes-file $env:RELEASE_NOTES
          }

          Get-ChildItem -Path artifacts -Recurse -File | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }
