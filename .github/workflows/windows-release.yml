name: Windows Release Build

on:
  push:
    branches:
      - main
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build VxClick Windows bundles
        run: npm run tauri:build

      - name: Verify Windows shell metadata
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/release/vxclick.exe"
          $exe = [System.IO.File]::ReadAllBytes($exePath)
          $peOffset = [BitConverter]::ToInt32($exe, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($exe, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "vxclick.exe must use IMAGE_SUBSYSTEM_WINDOWS_GUI (2), got $subsystem"
          }

          $icoPath = "src-tauri/icons/icon.ico"
          $ico = [System.IO.File]::ReadAllBytes($icoPath)
          $iconCount = [BitConverter]::ToUInt16($ico, 4)
          if ($iconCount -lt 6) {
            throw "icon.ico must contain a multi-resolution icon set; found only $iconCount image(s)"
          }

          Write-Host "Verified GUI subsystem and $iconCount Windows icon layers."

      - name: Collect portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src-tauri/target/release/vxclick.exe" "artifacts/VxClick.exe"
          if (Test-Path "src-tauri/target/release/bundle") {
            Copy-Item "src-tauri/target/release/bundle" "artifacts/bundle" -Recurse
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: VxClick-Windows-x64
          path: artifacts/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Publish VxClick 1.0.1 GitHub Release
        if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: VxClick 1.0.1') }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.1"
          $releaseSha = $env:GITHUB_SHA

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag $releaseSha
          git push origin "refs/tags/$tag" --force

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --target $releaseSha --title "VxClick 1.0.1" --notes-file "docs/releases/v1.0.1.md"
          } else {
            gh release create $tag --target $releaseSha --title "VxClick 1.0.1" --notes-file "docs/releases/v1.0.1.md"
          }

          Get-ChildItem -Path artifacts -Recurse -File | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }
