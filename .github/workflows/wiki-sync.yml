name: Publish Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/wiki-sync.yml"

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare wiki pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wiki-publish
          mkdir .wiki-publish

          # User-facing Wiki pages are the canonical source for Home, guides,
          # sidebar and footer.
          cp docs/wiki/*.md .wiki-publish/

          # Publish selected repository documentation with stable Wiki names.
          cp docs/getting-started.md .wiki-publish/Getting-Started.md
          cp docs/features.md .wiki-publish/Feature-Status.md
          cp docs/architecture.md .wiki-publish/Architecture.md
          cp docs/timing-engine.md .wiki-publish/Timing-Engine.md
          cp docs/automation-systems.md .wiki-publish/Automation-Systems.md
          cp docs/development.md .wiki-publish/Development.md
          cp docs/regression-checklist.md .wiki-publish/Regression-Checklist.md
          cp CHANGELOG.md .wiki-publish/Changelog.md

          # Rewrite repository-document links to canonical GitHub Wiki pages.
          for file in .wiki-publish/*.md; do
            sed -i \
              -e 's#](../README\.md)#](Home)#g' \
              -e 's#](README\.md)#](Home)#g' \
              -e 's#](getting-started\.md)#](Getting-Started)#g' \
              -e 's#](features\.md)#](Feature-Status)#g' \
              -e 's#](architecture\.md)#](Architecture)#g' \
              -e 's#](timing-engine\.md)#](Timing-Engine)#g' \
              -e 's#](automation-systems\.md)#](Automation-Systems)#g' \
              -e 's#](development\.md)#](Development)#g' \
              -e 's#](diagnostics\.md)#](Diagnostics)#g' \
              -e 's#](regression-checklist\.md)#](Regression-Checklist)#g' \
              -e 's#](../CHANGELOG\.md)#](Changelog)#g' \
              -e 's#](CHANGELOG\.md)#](Changelog)#g' \
              "$file"

            # Source-code links should continue to point at the repository,
            # not at non-existent pages inside the Wiki repository.
            sed -i \
              -e "s#](../src/#](https://github.com/${GITHUB_REPOSITORY}/blob/main/src/#g" \
              -e "s#](../src-tauri/#](https://github.com/${GITHUB_REPOSITORY}/blob/main/src-tauri/#g" \
              -e "s#](../ui/#](https://github.com/${GITHUB_REPOSITORY}/blob/main/ui/#g" \
              "$file"
          done

          test -f .wiki-publish/Home.md
          test -f .wiki-publish/_Sidebar.md
          test -f .wiki-publish/_Footer.md

      - name: Publish to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" .wiki-repo
          find .wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .wiki-publish/. .wiki-repo/
          cd .wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD
