[package]
name = "vxclick"
version = "0.2.0"
edition = "2024"
description = "VxClick Windows automation desktop app"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auto-clicker-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
